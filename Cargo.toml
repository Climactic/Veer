[package]
name = "veer"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Inertia.js v3 server-side protocol superset for Rust"
repository = "https://github.com/climactic/veer"
documentation = "https://docs.rs/veer"
readme = "README.md"
keywords = ["inertia", "axum", "spa", "react", "vue"]
categories = ["web-programming", "web-programming::http-server"]

[features]
default = ["axum"]
axum = ["dep:axum", "dep:indexmap", "dep:tower", "dep:tower-layer", "dep:tower-service", "dep:http-body", "dep:http-body-util", "dep:bytes", "dep:pin-project-lite"]
ssr = ["dep:reqwest"]
cookie-session = ["dep:cookie", "dep:hmac", "dep:sha2", "dep:base64"]
tower-sessions = ["dep:tower-sessions"]
multipart = ["axum", "axum?/multipart", "dep:base64", "dep:bytes"]
validator = ["dep:validator"]
garde = ["dep:garde"]
csrf = ["axum", "dep:cookie", "dep:hmac", "dep:sha2", "dep:base64", "dep:getrandom", "dep:subtle"]
embed = ["axum"]
ts = ["dep:ts-rs", "dep:inventory"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.1"
async-trait = "0.1"
tracing = "0.1"
thiserror = "2.0"

axum = { version = "0.8", optional = true }
indexmap = { version = "2", optional = true }
tower = { version = "0.5", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
http-body = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1.7", optional = true }
pin-project-lite = { version = "0.2", optional = true }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

cookie = { version = "0.18", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
subtle = { version = "2", optional = true }

tower-sessions = { version = "0.15", optional = true }

validator = { version = "0.20", features = ["derive"], optional = true }
garde = { version = "0.23", features = ["derive", "email"], optional = true }

ts-rs = { version = "11", optional = true }
inventory = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1.0"
pretty_assertions = "1.4"
axum = "0.8"
http = "1.1"
async-trait = "0.1"

[workspace]
members = [".", "examples/axum-react-todo"]
