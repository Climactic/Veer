[package]
name = "axum-react-todo"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
veer = { path = "../..", features = ["axum", "cookie-session", "validator", "ssr", "ts"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
validator = { version = "0.20", features = ["derive"] }
ts-rs = "11"
